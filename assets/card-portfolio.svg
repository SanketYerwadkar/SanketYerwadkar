<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="Portfolio project card">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#0F1730"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="wv" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0.30"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
<radialGradient id="ac"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.45"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
<radialGradient id="ac2"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<clipPath id="card-rc"><rect width="640" height="250" rx="16"/></clipPath>
</defs>
<rect width="640" height="250" rx="16" fill="url(#bg)"/>
<rect width="640" height="250" rx="16" fill="url(#grid)"/>

<!-- Breathing ambient glows -->
<circle cx="610" cy="25" r="160" fill="url(#ac)">
  <animate attributeName="r" values="130;185;130" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="30" cy="230" r="110" fill="url(#ac2)">
  <animate attributeName="r" values="90;130;90" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.15;0.45;0.15" dur="8s" repeatCount="indefinite"/>
</circle>

<!-- Rotating cyber tech rings in corner -->
<g fill="none" stroke="#3B82F6" stroke-opacity="0.28">
  <circle cx="555" cy="68" r="44" stroke-dasharray="3 7"/>
  <circle cx="555" cy="24" r="3.5" fill="#3B82F6" stroke="none"/>
  <animateTransform attributeName="transform" type="rotate" from="0 555 68" to="360 555 68" dur="24s" repeatCount="indefinite"/>
</g>
<g fill="none" stroke="#FFFFFF" stroke-opacity="0.16">
  <circle cx="555" cy="68" r="26" stroke-dasharray="2 5"/>
  <circle cx="555" cy="94" r="2.5" fill="#22D3EE" stroke="none"/>
  <animateTransform attributeName="transform" type="rotate" from="360 555 68" to="0 555 68" dur="16s" repeatCount="indefinite"/>
</g>
<path d="M550 68 H560 M555 63 V555 73" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1"/>

<!-- Fluid wave at card bottom -->
<g clip-path="url(#card-rc)">
  <path d="M0,240 Q80,232 160,240 T320,240 T480,240 T640,240 T800,240 T960,240 L960,250 L0,250 Z" fill="url(#wv)" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-320 0" dur="8s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Outer card border -->
<rect x="0.5" y="0.5" width="639" height="249" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.11"/>

<!-- Animated top accent energy beam -->
<rect x="32" y="0" width="60" height="3" rx="1.5" fill="#3B82F6">
  <animate attributeName="width" values="50;95;50" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- Corner twinkle sparkle -->
<circle cx="32" cy="24" r="2" fill="#3B82F6">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="r" values="1.5;3;1.5" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- Card number -->
<text x="32" y="42" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="3" fill="#3B82F6">06</text>

<rect x="524" y="24" width="84" height="26" rx="13" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45"/><circle cx="539" cy="37" r="3.5" fill="#3B82F6"/><circle cx="539" cy="37" r="3.5" fill="none" stroke="#3B82F6" stroke-width="1.5"><animate attributeName="r" values="3.5;11" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/></circle><circle cx="539" cy="37" r="3.5" fill="none" stroke="#3B82F6" stroke-width="1"><animate attributeName="r" values="3.5;11" begin="1s" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" begin="1s" dur="2s" repeatCount="indefinite"/></circle><text x="551" y="41.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#3B82F6">ACTIVE</text>

<!-- Project Title -->
<text x="31" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.4" fill="#F8FAFC">Portfolio</text>

<!-- Animated title underline bar -->
<rect x="32" y="108" width="44" height="2.5" rx="1.25" fill="url(#ln)">
  <animate attributeName="width" values="40;80;40" dur="4.5s" repeatCount="indefinite"/>
</rect>

<text x="32" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#94A3B8">Personal portfolio website with my projects, skills and contact</text><text x="32" y="162" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#94A3B8">details.</text>
<rect x="32" y="190" width="53" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="59" y="208" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#CBD5E1" text-anchor="middle">HTML</text><rect x="93.2" y="190" width="46" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="116" y="208" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#CBD5E1" text-anchor="middle">CSS</text><rect x="147.1" y="190" width="97" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/><text x="196" y="208" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#CBD5E1" text-anchor="middle">JavaScript</text>

<!-- Interactive animated GitHub button -->
<g>
  <rect x="532" y="197" width="76" height="26" rx="13" fill="#3B82F6" fill-opacity="0.09" stroke="#3B82F6" stroke-opacity="0.35"/>
  <text x="563" y="214" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="0.5" fill="#3B82F6" text-anchor="middle">GitHub</text>
  <g>
    <text x="594" y="214" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#3B82F6">→</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 3 0; 0 0" dur="1.6s" repeatCount="indefinite"/>
  </g>
</g>
</svg>