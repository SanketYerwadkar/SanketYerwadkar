<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Tech Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <text x="450" y="52" text-anchor="middle" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="6" fill="url(#g)" filter="url(#glow)" opacity="0.45">TECH STACK</text>
  <text x="450" y="52" text-anchor="middle" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="6" fill="url(#g)">TECH STACK</text>
  <text x="450" y="80" text-anchor="middle" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" letter-spacing="2" fill="#8b98b5">TOOLS I USE TO DESIGN, BUILD AND SHIP</text>
  <rect x="150" y="96" width="600" height="2" rx="1" fill="url(#line)"/>
  <circle r="3" cy="97" fill="#22d3ee">
    <animate attributeName="cx" values="150;750;150" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>